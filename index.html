```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Expogen 2026 Brochure</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .wrapper {
      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      background: #000;
      color: #fff;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    header {
      flex-shrink: 0;

      padding: 8px 12px;

      font-size: 14px;

      background: #111;
      border-bottom: 1px solid #333;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    header .title {
      font-weight: 600;
    }

    header .hint {
      font-size: 12px;
      opacity: 0.7;
      text-align: right;
    }

    .viewer {
      flex: 1;

      width: 100%;
      min-height: 0;

      border: none;

      background: #111;
    }

    .fallback {
      flex-shrink: 0;

      padding: 12px;

      font-size: 14px;
      line-height: 1.5;

      background: #111;
    }

    .fallback a {
      color: #4da3ff;
    }

    /* iPhone / small screens */
    @media (max-width: 600px) {
      header {
        padding:
          8px
          10px
          calc(8px + env(safe-area-inset-bottom));
      }

      header .title {
        font-size: 13px;
      }

      header .hint {
        display: none;
      }

      .viewer {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <header>
      <div class="title">
        Expogen 2026 – Brochure
      </div>

      <div class="hint">
        If it doesn't load, use the PDF below.
      </div>
    </header>

    <iframe
      class="viewer"
      src="EXPOGEN-2026.pdf#view=FitH"
      title="Expogen 2026 Brochure"
    ></iframe>

    <div class="fallback">
      If the brochure is not visible above,
      <a href="EXPOGEN-2026.pdf" target="_blank">
        click here to open the PDF
      </a>.
    </div>

  </div>

</body>
</html>
